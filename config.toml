title = "Enzo Cranford"
taxonomies = [{ name = "tags" }]

# The URL the site will be built for
base_url = "https://enzo.cranford.fr"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[extra]
theme = "toggle"
favicon = "/favicon.png"
menu = [
    { name = { "en" = "/projects", "fr" = "/projets" }, url = "/projects", weight = 2 },
    { name = { "en" = "/about", "fr" = "/à-propos" }, url = "/about", weight = 3 },
]
socials = [
    { name = "github", url = "https://github.com/enzoritto/", icon = "github" },
    { name = "itchio", url = "https://sasquirrel.itch.io", icon = "itchio" },
]

[languages.fr]
title = "Enzo Cranford"
